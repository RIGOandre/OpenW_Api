# Configuração do analisador estático, usado por `flutter analyze` e pelo
# editor. As regras vêm do flutter_lints; abaixo ficam as deste projeto.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Fora daqui só existe arquivo gerado pelo Flutter, que não tem o que
  # corrigir e enche a saída do analisador.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # A tela é widget dentro de widget: o que é `const` não é reconstruído a
    # cada setState.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    # Future solto dentro de método assíncrono foi a origem da maior parte dos
    # defeitos de ciclo de vida do app.
    - unawaited_futures
    # `load(cidade, true)` não diz o que o true significa; nomeado, diz.
    - avoid_positional_boolean_parameters
    - always_declare_return_types
    - prefer_single_quotes
