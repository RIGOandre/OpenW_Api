name: api_opw
description: "Previsão do tempo com dados da OpenWeatherMap, em Flutter."

# Aplicativo, não pacote: nada aqui vai para o pub.dev.
publish_to: 'none'

# Versão e número do build. Em `flutter build` dá para trocar os dois com
# --build-name e --build-number.
version: 1.0.0+1

# Mesmo piso do bloco `sdks:` do pubspec.lock que está no repositório: é o Dart
# em que as versões travadas lá resolvem. Veja a sua com `flutter --version`.
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.1.0
  sqflite: ^2.3.2
  # SQLite no Windows, Linux e macOS, onde o plugin nativo do sqflite não roda.
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  # Efeito de carregamento enquanto a resposta da API não chega.
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lints recomendados para Flutter. O que este projeto liga a mais está no
  # analysis_options.yaml.
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uma animação por condição do tempo, com versão de dia e de noite onde a
  # diferença aparece. O de-para entre o código da API e o arquivo está em
  # lib/utils/weather_assets.dart.
  assets:
    - assets/images/clear_night.gif
    - assets/images/cloudy_night.gif
    - assets/images/cloudy.gif
    - assets/images/cloudys.gif
    - assets/images/fog.gif
    - assets/images/heavy_rain.gif
    - assets/images/overcast.gif
    - assets/images/rain_d.gif
    - assets/images/rain_n.gif
    - assets/images/snow_d.gif
    - assets/images/snow_n.gif
    - assets/images/sunny.gif
    - assets/images/thunderstorm.gif
